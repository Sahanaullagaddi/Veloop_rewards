# Blueprint configuration for VELoop full-stack MERN deployment
services:
  - type: web
    name: veloop-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: veloop-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: veloop-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: veloop-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
